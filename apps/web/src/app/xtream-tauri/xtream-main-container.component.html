<div class="sidebar">
    <div class="sidebar-header">
        <app-playlist-switcher
            class="switcher"
            [currentTitle]="currentPlaylist()?.name || currentPlaylist()?.title || 'Playlist'"
            [subtitle]="'Xtream Code'"
        />
        <mat-slide-toggle
            class="category-filter-toggle"
            [checked]="categoryFilterEnabled()"
            (change)="onCategoryFilterToggle($event.checked)"
            [matTooltip]="'XTREAM.CATEGORY_MANAGEMENT.APPLY_FILTER' | translate"
        ></mat-slide-toggle>
        <button
            mat-icon-button
            class="manage-categories-btn"
            (click)="openCategoryManagement()"
            [matTooltip]="'XTREAM.CATEGORY_MANAGEMENT.TITLE' | translate"
        >
            <mat-icon>tune</mat-icon>
        </button>
    </div>
    <div class="category-search">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-icon matPrefix>search</mat-icon>
            <input
                matInput
                type="text"
                [placeholder]="'XTREAM.CATEGORY_MANAGEMENT.SEARCH_PLACEHOLDER' | translate"
                [ngModel]="categorySearchTerm()"
                (ngModelChange)="categorySearchTerm.set($event)"
            />
            @if (categorySearchTerm()) {
                <button matSuffix mat-icon-button (click)="categorySearchTerm.set('')">
                    <mat-icon>close</mat-icon>
                </button>
            }
        </mat-form-field>
    </div>
    <app-category-view
        [items]="filteredCategories()"
        [selectedCategoryId]="selectedCategoryId()"
        [itemCounts]="categoryItemCounts()"
        (categoryClicked)="categoryClicked($event)"
        [showCounts]="true"
    />
</div>

<div class="main-content">
    @if (!xtreamStore.selectedItem() && !xtreamStore.isLoadingDetails()) {
        <div class="content-header">
            <h2>
                <button mat-icon-button disabled>
                    <mat-icon>category</mat-icon>
                </button>
                {{ getContentLabel() }}
            </h2>
        </div>
    }
    <div
        class="scrollable-content"
        [class.no-header]="xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()"
    >
        <router-outlet />
    </div>
    <!-- <app-mpv-player-bar /> -->
</div>
